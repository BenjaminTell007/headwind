<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Headway Chain Console</title>
<link rel="stylesheet" href="../../design/tokens.css">
<style>
  :root { --bg: #222222; --line: #2e2e2e; --text: #ececec; --dim: #8c8c8c; --yes: #f2f2f2; --no: #6b6b6b; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Inter", "Helvetica Neue", Arial, sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; }
  h1, .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-weight: 300; letter-spacing: .12em; text-transform: uppercase; }
  h1 { font-size: 16px; margin: 0 0 16px; }
  .mono { font-size: 11px; color: var(--dim); }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
  button, input { background: transparent; color: var(--text); border: 1px solid #444; border-radius: 4px; padding: 6px 10px; font: inherit; }
  button:hover { border-color: var(--text); cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  input { width: 90px; }
  .card { border: 1px solid var(--line); border-radius: 6px; padding: 12px; margin: 12px 0; }
  .card.closed { opacity: .55; }
  .odds { height: 6px; background: var(--no); border-radius: 3px; overflow: hidden; margin: 8px 0; }
  .odds > div { height: 100%; background: var(--yes); transition: width .3s; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  #log { font: 12px/1.6 ui-monospace, Menlo, monospace; color: var(--dim); max-height: 260px; overflow: auto; border-top: 1px solid var(--line); padding-top: 8px; white-space: pre-wrap; word-break: break-all; }
  .blocks { display: flex; gap: 2px; height: 10px; margin: 8px 0; overflow: hidden; }
  .blocks span { flex: 0 0 6px; background: #3a3a3a; }
  .blocks span.Finalized, .blocks span.Verified { background: #8c8c8c; }
  .blocks span.hit { background: #f08a3c; }
  a { color: var(--text); }
</style>
</head>
<body>
<main>
  <h1>Headway · chain console</h1>
  <div class="mono" id="status">SYS.CHAIN: MONAD TESTNET · LOADING</div>
  <div class="blocks" id="blocks"></div>
  <div class="bar">
    <button id="burner">Use burner</button>
    <button id="injected">Use MetaMask</button>
    <span class="mono" id="who">no wallet</span>
    <label class="mono">stake <input id="stake" value="0.01"> MON</label>
    <button id="refresh">Refresh</button>
  </div>
  <div id="markets"></div>
  <div id="log"></div>
</main>
<script type="module">
import { getWallet, publicClient } from './wallet.js';
import { markets, formatMon, parseMon, explain } from './markets.js';
import { watch } from './events.js';
import { txUrl } from './config.js';

const $ = (id) => document.getElementById(id);
const log = (s) => { $('log').textContent = `${new Date().toLocaleTimeString()}  ${s}\n` + $('log').textContent; };
let wallet, m, list = [];
const mine = new Set();

async function showWallet() {
  if (!wallet) return;
  $('who').textContent = `${wallet.kind} ${wallet.address.slice(0, 8)}… · ${formatMon(await wallet.balance())} MON`;
}

async function connect(prefer) {
  try {
    log(`connecting ${prefer}…`);
    wallet = await getWallet({ prefer });
    await showWallet();
    render();
  } catch (e) { log(`wallet: ${explain(e)}`); }
}

async function act(label, fn) {
  if (!wallet) return log('connect a wallet first');
  try {
    log(`${label}…`);
    const t0 = performance.now();
    const r = await fn();
    mine.add(r.receipt.hash);
    log(`${label} ok in ${Math.round(performance.now() - t0)} ms, block ${r.receipt.blockNumber}, gas ${r.receipt.gasUsed}  ${txUrl(r.receipt.hash)}`);
    await load();
    await showWallet();
  } catch (e) { log(`${label} failed: ${explain(e)}`); }
}

async function render() {
  const pos = wallet ? await Promise.all(list.map((x) => m.position(x.id, wallet.address))) : [];
  $('markets').innerHTML = '';
  list.forEach((x, i) => {
    const p = pos[i];
    const el = document.createElement('div');
    el.className = 'card' + (x.open ? '' : ' closed');
    const close = new Date(x.closeTime * 1000).toLocaleString();
    el.innerHTML = `
      <div class="mono">#${x.id} · ${x.series} · ${x.resolved ? 'SETTLED ' + (x.outcomeYes ? 'YES' : 'NO') : x.open ? 'CLOSES ' + close : 'CLOSED'}</div>
      <div>${x.question}</div>
      <div class="odds"><div style="width:${(x.probYes * 100).toFixed(1)}%"></div></div>
      <div class="row mono">YES ${(x.probYes * 100).toFixed(1)}% · POOL ${formatMon(x.yesReserve + x.noReserve, 2)}
        ${p ? ` · YOU YES ${formatMon(p.yes, 3)} NO ${formatMon(p.no, 3)}${p.lp ? ' LP ' + formatMon(p.lp, 2) : ''}` : ''}</div>
      <div class="row" style="margin-top:8px"></div>`;
    const row = el.lastElementChild;
    const btn = (text, on, enabled = true) => { const b = document.createElement('button'); b.textContent = text; b.disabled = !enabled; b.onclick = on; row.append(b); };
    const stake = () => parseMon($('stake').value || '0.01');
    btn('Buy YES', () => act(`buy YES #${x.id}`, () => m.buy(wallet, x.id, true, stake())), x.open);
    btn('Buy NO', () => act(`buy NO #${x.id}`, () => m.buy(wallet, x.id, false, stake())), x.open);
    btn('Sell YES', () => act(`sell YES #${x.id}`, () => m.sell(wallet, x.id, true, p.yes)), x.open && p?.yes > 0n);
    btn('Sell NO', () => act(`sell NO #${x.id}`, () => m.sell(wallet, x.id, false, p.no)), x.open && p?.no > 0n);
    btn('Redeem', () => act(`redeem #${x.id}`, () => m.redeem(wallet, x.id)), x.resolved);
    btn('Hedge $500k', async () => {
      try {
        const h = await m.hedge(x.id, { cargoUsd: 500_000, delayDays: 12 });
        log(`hedge #${x.id}: loss $${h.lossUsd.toFixed(0)} → cover ${formatMon(h.coverMon, 2)} MON for ${formatMon(h.costMon, 3)} MON (premium ${(h.premium * 100).toFixed(1)}%, odds ${(h.probYes * 100).toFixed(1)}%)`);
      } catch (e) { log(`hedge: ${explain(e)}`); }
    }, x.open);
    $('markets').append(el);
  });
}

async function load() {
  list = (await m.list()).reverse();
  await render();
}

$('burner').onclick = () => connect('burner');
$('injected').onclick = () => connect('injected');
$('refresh').onclick = () => load();

try {
  m = await markets();
  await load();
  $('status').textContent = `SYS.CHAIN: MONAD TESTNET · MARKETS: ${list.length} · ${m.address}`;
  const blocks = $('blocks');
  const seen = new Map();
  await watch({
    onBlock: (b) => {
      let s = seen.get(b.hash);
      if (!s) {
        s = document.createElement('span');
        seen.set(b.hash, s);
        blocks.prepend(s);
        while (blocks.children.length > 160) { seen.delete([...seen.keys()][0]); blocks.lastElementChild.remove(); }
      }
      s.className = (s.classList.contains('hit') ? 'hit ' : '') + b.commitState;
    },
    onTrade: (t) => {
      if (t.commitState !== 'Proposed') return;
      log(`trade #${t.id} ${t.isBuy ? 'buy' : 'sell'} ${t.yes ? 'YES' : 'NO'} ${formatMon(t.amount)} MON → YES ${(t.probYes * 100).toFixed(1)}%${mine.has(t.txHash) ? ' (you)' : ''}`);
      const x = list.find((y) => y.id === t.id);
      if (x) { x.probYes = t.probYes; x.yesReserve = t.yesReserve; x.noReserve = t.noReserve; render(); }
    },
    onCreated: (c) => { if (c.commitState === 'Proposed') { log(`new market #${c.id}: ${c.question}`); load(); } },
    onResolved: (r) => { if (r.commitState === 'Proposed') { log(`market #${r.id} settled ${r.outcomeYes ? 'YES' : 'NO'} at ${r.value}`); load(); } },
  });
} catch (e) {
  $('status').textContent = 'SYS.CHAIN: NOT DEPLOYED YET';
  log(explain(e));
}
</script>
</body>
</html>

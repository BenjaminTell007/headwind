<script>
/* Self-update: GitHub Pages lets browsers reuse this page for 10 minutes. On open and
   whenever you come back to the tab, check the published version (never cached) and,
   if it's newer than this copy, reload once onto it. web/tools/stamp.sh sets both. */
(function () {
  var SITE_VERSION = '20261115T2308', URL_ = 'version.json';
  function check() {
    fetch(URL_ + '?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (d) {
      if (!d.v || d.v === SITE_VERSION) return;
      var key = 'hw-updated-' + d.v;
      try { if (sessionStorage.getItem(key)) return; sessionStorage.setItem(key, '1'); } catch (e) {}
      var q = new URLSearchParams(location.search); q.set('v', d.v);
      location.replace(location.pathname + '?' + q.toString() + location.hash);
    }).catch(function () {});
  }
  check();
  document.addEventListener('visibilitychange', function () { if (!document.hidden) check(); });
})();
</script>

<script>
/* The forecasts screen is Kimball's js/stats.js, built to slide up under the globe. Here it is
   the whole page: it opens at once and stays open. stats.js itself is not changed. These two
   listeners run before its own, so its "scroll up to close" and Escape never fire. */
window.addEventListener('wheel', function (e) { e.stopImmediatePropagation(); }, { capture: true, passive: true });
window.addEventListener('keydown', function (e) { if (e.key === 'Escape') e.stopImmediatePropagation(); }, { capture: true });
</script>
<script src="js/stats.js?v=20261115T2308"></script>

<script>
(function () {
  var HW = window.HW, open = function () { var b = document.querySelector('.statsBtn'); if (b && !document.body.classList.contains('statsOpen')) b.click(); };
  open();
  new MutationObserver(open).observe(document.body, { attributes: true, attributeFilter: ['class'] });
  var t = document.getElementById('theme'), paint = function () { t.textContent = HW.C.theme === 'light' ? '☾' : '☀'; };
  paint();
  t.addEventListener('click', function () { HW.setTheme(HW.C.theme === 'light' ? 'dark' : 'light'); paint(); });
})();
</script>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Headway</title>
<meta name="description" content="Forecast and hedge trade disruptions: every shipping route and strait, live ships, and markets that settle onchain on Monad.">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div id="intro">
  <canvas id="introcv" width="1360" height="320"></canvas>
  <div class="tag" id="introtag">SYS.ROUTES: 210 · STRAITS: 28 · LOADING</div>
</div>

<div id="app">
  <canvas id="globe"></canvas>

  <header>
    <div class="brand"><canvas id="brandcv" width="528" height="96"></canvas></div>
    <span class="live off tag" id="sysLive"><b id="sysShips">—</b> SHIPS UNDERWAY</span>
    <form class="search" id="search" autocomplete="off">
      <input id="q" placeholder="Find a ship: name, IMO or MMSI" aria-label="Find a ship">
      <span class="err" id="qerr"></span>
    </form>
    <button class="pill" id="mtoggle" aria-expanded="true">MARKETS</button>
    <button class="pill icon" id="theme" aria-label="Switch light or dark mode" title="Light / dark mode"></button>
    <button class="pill" id="wallet">CONNECT WALLET</button>
  </header>

  <section class="overview" id="overview"></section>

  <aside class="rail" id="rail">
    <div class="head">
      <span class="tag">MARKETS</span>
      <div class="tabs" id="mtabs">
        <button data-g="live" class="on">LIVE</button>
        <button data-g="route">ROUTES</button>
        <button data-g="weekly">STRAITS</button>
        <button data-g="trade">TRADE</button>
      </div>
    </div>
    <div class="mlist" id="mlist"></div>
    <div class="note" id="mnote"></div>
  </aside>

  <aside class="panel" id="panel"><button class="x" id="px" aria-label="Close">✕</button><div id="pbody"></div></aside>

  <nav class="ctl" id="ctl" aria-label="Globe controls">
    <div class="grp">
      <button data-a="zin" title="Zoom in (+)" aria-label="Zoom in">+</button>
      <button data-a="zout" title="Zoom out (−)" aria-label="Zoom out">−</button>
    </div>
    <div class="grp pad">
      <button data-a="up" title="Tilt up (↑)" aria-label="Tilt up">▲</button>
      <div class="mid">
        <button data-a="left" title="Turn left (←)" aria-label="Turn left">◀</button>
        <button data-a="north" class="n" title="North up (N)" aria-label="North up">N</button>
        <button data-a="right" title="Turn right (→)" aria-label="Turn right">▶</button>
      </div>
      <button data-a="down" title="Tilt down (↓)" aria-label="Tilt down">▼</button>
    </div>
    <div class="grp">
      <button data-a="rollL" title="Rotate the picture left ([)" aria-label="Rotate left">↺</button>
      <button data-a="rollR" title="Rotate the picture right (])" aria-label="Rotate right">↻</button>
      <button data-a="flip" title="Flip upside down (F)" aria-label="Flip upside down">⇅</button>
    </div>
    <div class="grp">
      <button data-a="spin" title="Spin slowly (space)" aria-label="Auto spin">⟳</button>
      <button data-a="home" title="Reset view (R)" aria-label="Reset view">⌂</button>
    </div>
    <select id="goto" aria-label="Go to a strait"><option value="">GO TO…</option></select>
  </nav>

  <div class="legend">
    <span><i style="background:var(--container)"></i>CARGO / CONTAINER</span>
    <span><i style="background:var(--tanker)"></i>TANKER</span>
    <span><i class="ln"></i>SHIPPING ROUTE</span>
    <span><i class="ring"></i>STRAIT · GAP = TRAFFIC VS 2023</span>
  </div>
</div>

<div id="dive">
  <svg id="divesvg" viewBox="0 0 1000 700" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
  <button class="pill back" id="back">← GLOBE</button>
  <div class="dhead">
    <div class="tag" id="dtype"></div>
    <h1 id="dname"></h1>
    <div class="tag" id="dsub"></div>
  </div>
  <aside class="dcard" id="dcard"></aside>
</div>

<script src="js/util.js"></script>
<script src="js/data.js"></script>
<script src="js/logo.js"></script>
<script src="js/globe.js"></script>
<script src="js/dive.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>

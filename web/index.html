<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Headway</title>
<meta name="description" content="Forecast and hedge trade disruptions: every shipping route and strait, live ships, and markets that settle onchain on Monad.">
<link rel="stylesheet" href="app.css">
</head>
<body>

<div id="intro">
  <canvas id="introcv" width="1360" height="320"></canvas>
  <div class="tag" id="introtag">SYS.ROUTES: 210 · STRAITS: 28 · LOADING</div>
</div>

<div id="app">
  <canvas id="globe"></canvas>

  <header>
    <div class="brand"><canvas id="brandcv" width="528" height="96"></canvas></div>
    <div class="sys tag">
      <span>ROUTES <b id="sysRoutes">210</b></span>
      <span>STRAITS <b id="sysStraits">28</b></span>
      <span class="live off" id="sysLive">SHIPS LIVE <b id="sysShips">—</b></span>
      <span>DATA TO <b id="sysAsOf">—</b></span>
    </div>
    <form class="search" id="search" autocomplete="off">
      <span class="tag">FIND</span>
      <input id="q" placeholder="SHIP NAME, IMO OR MMSI">
      <span class="err" id="qerr"></span>
    </form>
    <button class="wallet" id="wallet">CONNECT WALLET</button>
  </header>

  <section class="overview" id="overview"></section>

  <aside class="rail">
    <div class="head">
      <span class="tag">MARKETS</span>
      <div class="tabs" id="mtabs">
        <button data-g="live" class="on">LIVE</button>
        <button data-g="route">ROUTES</button>
        <button data-g="weekly">STRAITS</button>
        <button data-g="trade">TRADE</button>
      </div>
    </div>
    <div class="mlist" id="mlist"></div>
    <div class="note" id="mnote"></div>
  </aside>

  <aside class="panel" id="panel"><button class="x" id="px" aria-label="Close">✕</button><div id="pbody"></div></aside>

  <div class="zoomctl"><button id="zin" aria-label="Zoom in">+</button><button id="zout" aria-label="Zoom out">−</button></div>

  <div class="legend">
    <span><i style="background:var(--container)"></i>CONTAINER</span>
    <span><i style="background:var(--tanker)"></i>TANKER</span>
    <span><i style="background:var(--bulk)"></i>DRY BULK</span>
    <span><i style="background:var(--general)"></i>GENERAL</span>
    <span><i style="background:var(--roro)"></i>RO-RO</span>
  </div>

  <div class="evtext" id="evtext"><div class="tag" id="evwhen"></div><div class="t" id="evtitle"></div></div>

  <div class="timeline">
    <button class="play" id="play" aria-label="Play">▶</button>
    <div class="date"><div class="tag" id="tlLabel">WEEK ENDING</div><div class="num" id="tlDate">—</div></div>
    <div class="track" id="track"><div class="spark" id="tlSpark"></div><input type="range" id="tl" min="0" max="1" step="0.01"></div>
    <div class="jumps" id="jumps">
      <button data-d="2021-03-28">EVER GIVEN</button>
      <button data-d="2023-12-17">PANAMA DROUGHT</button>
      <button data-d="2024-02-25">RED SEA</button>
      <button data-d="2026-03-29">HORMUZ</button>
      <button data-d="now" class="on">NOW</button>
    </div>
  </div>
</div>

<div id="dive">
  <canvas id="shipcv"></canvas>
  <div class="hud">
    <button class="back" id="back">← GLOBE</button>
    <div class="cams" id="cams"><button data-m="top" class="on">DRONE</button><button data-m="side">PROFILE</button></div>
    <div class="scale tag" id="hudScale"></div>
    <svg class="compass" id="compass" viewBox="0 0 62 62"></svg>
    <svg class="cross" id="cross" viewBox="0 0 54 54"><path d="M0 10V0h10M44 0h10v10M54 44v10H44M10 54H0V44" fill="none" stroke="#ececec" stroke-width="1"/></svg>
    <div class="card ident" id="ident"></div>
    <div class="card wx" id="wx"></div>
  </div>
</div>

<script src="js/util.js"></script>
<script src="js/data.js"></script>
<script src="js/logo.js"></script>
<script src="js/globe.js"></script>
<script src="js/ship.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
